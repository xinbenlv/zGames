<head>

<style>
  :root { --bg:#0e1116; --fg:#e6e6e6; --muted:#8b949e; --card:#161b22; --accent:#f0b429; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:48px 16px; }
  h1 { margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 32px; }
  ul { list-style:none; padding:0; display:grid; gap:12px; }
  a { display:block; padding:16px 20px; background:var(--card); border-radius:10px; color:var(--fg); text-decoration:none; }
  a:hover { outline:2px solid var(--accent); }
  small { color:var(--muted); display:block; }
</style>
</head>
<body>
<main>
  <h1>zGames</h1>
  <p>单机网页游戏 · Single-player web games</p>
