<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>货场突袭 Strike · zGames</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none;
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.num{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.8)}
#radar{position:absolute;left:18px;top:18px;width:170px;height:170px;border-radius:50%;
  border:2px solid rgba(255,255,255,.28);box-shadow:0 0 12px rgba(0,0,0,.5)}
#top{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:18px;align-items:center;
  background:rgba(0,0,0,.42);padding:6px 18px;border-radius:4px;font-size:20px}
#top small{font-size:13px;opacity:.75;margin-right:6px}
#feed{position:absolute;top:16px;right:18px;display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:14px}
#feed div{background:rgba(0,0,0,.5);padding:4px 10px;border-radius:3px;border-left:3px solid #e9b44c;transition:opacity .5s}
#feed div.bad{border-left-color:#e5484d}
#feed b{color:#8fd3ff;font-weight:600}#feed i{color:#ff8b7b;font-style:normal}#feed u{color:#ffd76a;text-decoration:none;margin-left:6px}
#cross{position:absolute;left:50%;top:50%;width:0;height:0;--g:6px}
#cross i{position:absolute;background:#6dff8a;box-shadow:0 0 0 1px rgba(0,0,0,.55)}
#cross .t{width:2px;height:9px;left:-1px;bottom:var(--g)}
#cross .b{width:2px;height:9px;left:-1px;top:var(--g)}
#cross .l{height:2px;width:9px;top:-1px;right:var(--g)}
#cross .r{height:2px;width:9px;top:-1px;left:var(--g)}
#cross .d{width:2px;height:2px;left:-1px;top:-1px}
#hit{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
#hit i{position:absolute;left:-13px;top:-1px;width:26px;height:2px;background:#fff;box-shadow:0 0 3px #000}
#hit i:first-child{transform:rotate(45deg)}#hit i:last-child{transform:rotate(-45deg)}
#hit.head i{background:#ff4d4d}
#dir{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
#dir i{position:absolute;left:-130px;top:-130px;width:250px;height:250px;border-radius:50%;
  border:6px solid transparent;border-top-color:rgba(255,45,45,.95)}
#hurt{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,rgba(255,0,0,0) 55%,rgba(190,0,0,.6) 100%)}
#rbar{position:absolute;left:50%;top:calc(50% + 46px);width:90px;height:4px;margin-left:-45px;background:rgba(0,0,0,.5);border-radius:2px;overflow:hidden}
#rbar i{display:block;height:100%;width:0;background:#e9e9e9}
#toast{position:absolute;left:50%;top:66%;transform:translateX(-50%);font-size:16px;background:rgba(0,0,0,.45);padding:5px 14px;border-radius:3px;opacity:0;transition:opacity .25s}
.panel{position:absolute;bottom:20px;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.55));padding:10px 18px;border-radius:4px;display:flex;align-items:flex-end;gap:22px}
#bl{left:18px}#br{right:18px;text-align:right}
.stat{display:flex;align-items:center;gap:8px}
.stat svg{width:26px;height:26px}
.stat span{font-size:40px;line-height:1;font-weight:700}
#hp.low{color:#ff5a5a}
#ammo{font-size:46px;line-height:1;font-weight:700}
#res{font-size:22px;opacity:.75}
#wname{font-size:14px;opacity:.85;margin-bottom:4px}
#slots{font-size:12px;opacity:.9;display:flex;gap:8px;justify-content:flex-end;margin-bottom:6px}
#slots span{padding:1px 7px;border:1px solid rgba(255,255,255,.3);border-radius:2px;opacity:.5}
#slots span.on{opacity:1;border-color:#e9b44c;color:#ffd98a}

/* ---------- overlay ---------- */
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(8,12,18,.45),rgba(4,6,10,.88))}
.box{width:min(560px,90vw);text-align:center}
h1{margin:0;font-size:60px;letter-spacing:10px;font-weight:800}
h2{margin:0 0 6px;font-size:44px;letter-spacing:6px}
.sub{letter-spacing:5px;font-size:13px;opacity:.7;margin:6px 0 22px}
.brief{font-size:16px;opacity:.9;margin-bottom:20px;line-height:1.7}
.diff{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
button{font:inherit;color:#fff;cursor:pointer;border-radius:3px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.07);padding:7px 20px}
button:hover{background:rgba(255,255,255,.16)}
.diff button.on{border-color:#e9b44c;color:#ffd98a;background:rgba(233,180,76,.16)}
button.go{font-size:20px;letter-spacing:6px;padding:12px 46px;background:#e9b44c;color:#1a1408;border-color:#e9b44c;font-weight:700}
button.go:hover{background:#ffd27a}
.keys{margin:24px auto 0;display:grid;grid-template-columns:auto auto auto auto;gap:7px 14px;font-size:13px;opacity:.85;justify-content:center;text-align:left}
.keys kbd{font-family:ui-monospace,Menlo,Consolas,monospace;border:1px solid rgba(255,255,255,.4);border-radius:3px;padding:1px 7px;background:rgba(255,255,255,.08);text-align:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0 26px}
.stats div{background:rgba(255,255,255,.07);padding:12px 4px;border-radius:4px}
.stats b{display:block;font-size:28px}.stats span{font-size:12px;opacity:.7}
.win{color:#9be28a}.lose{color:#ff6a6a}
#err{color:#ff8a8a;margin-top:14px}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" class="hidden">
  <canvas id="radar" width="340" height="340"></canvas>
  <div id="top"><span class="num" id="timer">3:00</span><span><small>剩余敌人</small><span class="num" id="left">0</span></span></div>
  <div id="feed"></div>
  <div id="hurt"></div>
  <div id="dir"><i></i></div>
  <div id="cross"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="d"></i></div>
  <div id="hit"><i></i><i></i></div>
  <div id="rbar" class="hidden"><i></i></div>
  <div id="toast"></div>
  <div id="bl" class="panel">
    <div class="stat"><svg viewBox="0 0 24 24"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z" fill="#fff"/></svg><span class="num" id="hp">100</span></div>
    <div class="stat"><svg viewBox="0 0 24 24"><path d="M12 1l9 3v7c0 6-4 10-9 12C7 21 3 17 3 11V4z" fill="none" stroke="#fff" stroke-width="2.4"/></svg><span class="num" id="armor">100</span></div>
  </div>
  <div id="br" class="panel"><div>
    <div id="slots"><span id="s0">1 突击步枪</span><span id="s1">2 手枪</span></div>
    <div id="wname"></div>
    <div><span class="num" id="ammo">30</span> <span class="num" id="res">/ 90</span></div>
  </div></div>
</div>

<div id="overlay">
  <div class="box" id="menu">
    <h1>货场突袭</h1>
    <div class="sub">YARD BREACH · 1 号货场</div>
    <div class="brief">肃清货场内的全部武装分子。限时 3 分钟，阵亡即失败。</div>
    <div class="diff" id="diff"><button data-d="0">简单</button><button data-d="1" class="on">普通</button><button data-d="2">困难</button></div>
    <button class="go" id="start">开始行动</button>
    <div class="keys">
      <kbd>W A S D</kbd><span>移动</span><kbd>鼠标</kbd><span>瞄准 / 左键开火</span>
      <kbd>空格</kbd><span>跳跃</span><kbd>C</kbd><span>蹲下（更稳）</span>
      <kbd>Shift</kbd><span>静步</span><kbd>R</kbd><span>换弹</span>
      <kbd>1 2 Q</kbd><span>切换武器</span><kbd>Esc</kbd><span>暂停</span>
    </div>
    <div id="err"></div>
    <div class="sub" style="margin-top:18px"><a href="/g/" style="color:#e9b44c">← 返回 zGames</a></div>
  </div>
  <div class="box hidden" id="pause">
    <h2>已暂停</h2>
    <div class="brief">点击任意位置继续 · <kbd>-</kbd> <kbd>=</kbd> 可调鼠标灵敏度</div>
    <button class="go" id="resume">继续</button>
  </div>
  <div class="box hidden" id="result">
    <h2 id="rtitle"></h2>
    <div class="brief" id="rsub"></div>
    <div class="stats">
      <div><b class="num" id="rk">0</b><span>击杀</span></div>
      <div><b class="num" id="rh">0</b><span>爆头</span></div>
      <div><b class="num" id="ra">0%</b><span>命中率</span></div>
      <div><b class="num" id="rt">0:00</b><span>用时</span></div>
    </div>
    <button class="go" id="again">再来一局</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('gl');
if (matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches) $('err').textContent = '本游戏需要键盘和鼠标，请在电脑上打开。';
const gl = canvas.getContext('webgl2', {antialias: true, alpha: false, powerPreference: 'high-performance'});
if (!gl) { $('err').textContent = '当前浏览器不支持 WebGL2，无法运行本游戏。'; $('start').disabled = true; return; }

/* ============================== 数学工具 ============================== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const angDiff = (a, b) => { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
function gauss() { let u = 0; while (u === 0) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * Math.random()); }
function rng32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const _mt = new Float32Array(16);
const m4 = {
  create() { const m = new Float32Array(16); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  ident(m) { m.fill(0); m[0] = m[5] = m[10] = m[15] = 1; return m; },
  mul(o, a, b) {
    for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++)
      _mt[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] + a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    o.set(_mt); return o;
  },
  persp(o, fovy, asp, n, f) { const t = 1 / Math.tan(fovy / 2); o.fill(0); o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f); return o; },
  ortho(o, l, r, b, t, n, f) { o.fill(0); o[0] = 2 / (r - l); o[5] = 2 / (t - b); o[10] = -2 / (f - n); o[12] = -(r + l) / (r - l); o[13] = -(t + b) / (t - b); o[14] = -(f + n) / (f - n); o[15] = 1; return o; },
  lookAt(o, e, c, u) {
    let zx = e[0] - c[0], zy = e[1] - c[1], zz = e[2] - c[2]; let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
    let xx = u[1] * zz - u[2] * zy, xy = u[2] * zx - u[0] * zz, xz = u[0] * zy - u[1] * zx; l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    o[0] = xx; o[1] = yx; o[2] = zx; o[3] = 0; o[4] = xy; o[5] = yy; o[6] = zy; o[7] = 0; o[8] = xz; o[9] = yz; o[10] = zz; o[11] = 0;
    o[12] = -(xx * e[0] + xy * e[1] + xz * e[2]); o[13] = -(yx * e[0] + yy * e[1] + yz * e[2]); o[14] = -(zx * e[0] + zy * e[1] + zz * e[2]); o[15] = 1; return o;
  },
  translate(m, x, y, z) { for (let i = 0; i < 4; i++) m[12 + i] += m[i] * x + m[4 + i] * y + m[8 + i] * z; return m; },
  scale(m, x, y, z) { for (let i = 0; i < 4; i++) { m[i] *= x; m[4 + i] *= y; m[8 + i] *= z; } return m; },
  rotX(m, a) { const c = Math.cos(a), s = Math.sin(a); for (let i = 0; i < 4; i++) { const y = m[4 + i], z = m[8 + i]; m[4 + i] = y * c + z * s; m[8 + i] = z * c - y * s; } return m; },
  rotY(m, a) { const c = Math.cos(a), s = Math.sin(a); for (let i = 0; i < 4; i++) { const x = m[i], z = m[8 + i]; m[i] = x * c - z * s; m[8 + i] = x * s + z * c; } return m; },
  rotZ(m, a) { const c = Math.cos(a), s = Math.sin(a); for (let i = 0; i < 4; i++) { const x = m[i], y = m[4 + i]; m[i] = x * c + y * s; m[4 + i] = y * c - x * s; } return m; },
};
// 朝向约定：yaw=0 看向 -Z，yaw 增大向左转；pitch 向上为正
const dirFrom = (yaw, pitch) => [-Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), -Math.cos(yaw) * Math.cos(pitch)];

/* ============================== 程序化贴图 ============================== */
function makeCanvas(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); fn(g, w, h); return c; }
function speckle(g, w, h, amp, R) { const id = g.getImageData(0, 0, w, h), d = id.data; for (let i = 0; i < d.length; i += 4) { const n = (R() - .5) * amp; d[i] += n; d[i + 1] += n; d[i + 2] += n; } g.putImageData(id, 0, 0); }
function blots(g, s, R, n, r0, r1, rgb, a) { // 可无缝平铺的柔和色斑
  for (let i = 0; i < n; i++) {
    const x = R() * s, y = R() * s, r = r0 + R() * (r1 - r0);
    for (let ox = -s; ox <= s; ox += s) for (let oy = -s; oy <= s; oy += s) {
      if (x + ox + r < 0 || x + ox - r > s || y + oy + r < 0 || y + oy - r > s) continue;
      const gr = g.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r);
      gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`);
      g.fillStyle = gr; g.fillRect(x + ox - r, y + oy - r, r * 2, r * 2);
    }
  }
}
const TEXSRC = {
  white: makeCanvas(4, 4, (g) => { g.fillStyle = '#fff'; g.fillRect(0, 0, 4, 4); }),
  fabric: makeCanvas(64, 64, (g, s) => { g.fillStyle = '#e4e4e4'; g.fillRect(0, 0, s, s); speckle(g, s, s, 44, rng32(7)); }),
  ground: makeCanvas(512, 512, (g, s) => {
    const R = rng32(11); g.fillStyle = '#7b766b'; g.fillRect(0, 0, s, s);
    blots(g, s, R, 50, 30, 110, '40,36,30', .10); blots(g, s, R, 50, 30, 110, '190,180,160', .08); blots(g, s, R, 8, 20, 60, '20,18,16', .22);
    g.lineWidth = 1.3;
    for (let i = 0; i < 9; i++) { let x = R() * s, y = R() * s, a = R() * TAU; g.strokeStyle = 'rgba(38,34,30,.45)'; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 26; k++) { a += (R() - .5) * 1.1; x += Math.cos(a) * 7; y += Math.sin(a) * 7; g.lineTo(x, y); } g.stroke(); }
    for (let i = 0; i < 900; i++) { g.fillStyle = R() < .5 ? 'rgba(210,205,190,.35)' : 'rgba(30,28,25,.35)'; g.fillRect(R() * s, R() * s, 1 + R() * 1.6, 1 + R() * 1.6); }
    speckle(g, s, s, 28, R);
  }),
  wall: makeCanvas(256, 256, (g, s) => {
    const R = rng32(23); g.fillStyle = '#857a66'; g.fillRect(0, 0, s, s);
    for (let r = 0; r < 4; r++) for (let c = -1; c < 2; c++) {
      const v = 168 + R() * 26 | 0; g.fillStyle = `rgb(${v + 8},${v - 4},${v - 30})`;
      g.fillRect(c * 128 + (r % 2 ? 64 : 0) + 2, r * 64 + 2, 124, 60);
    }
    blots(g, s, R, 26, 12, 50, '60,50,36', .12); blots(g, s, R, 16, 10, 40, '235,225,200', .10);
    speckle(g, s, s, 24, R);
  }),
  concrete: makeCanvas(256, 256, (g, s) => {
    const R = rng32(31); g.fillStyle = '#9d9b94'; g.fillRect(0, 0, s, s);
    blots(g, s, R, 30, 16, 70, '60,60,58', .10); blots(g, s, R, 22, 16, 60, '225,222,214', .10);
    g.fillStyle = 'rgba(40,40,40,.5)'; g.fillRect(0, 0, s, 2); g.fillRect(0, 0, 2, s);
    g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(0, 2, s, 1); g.fillRect(2, 0, 1, s);
    for (const [x, y] of [[40, 40], [216, 40], [40, 216], [216, 216]]) { g.fillStyle = 'rgba(45,45,45,.6)'; g.beginPath(); g.arc(x, y, 4, 0, TAU); g.fill(); }
    speckle(g, s, s, 22, R);
  }),
  metal: makeCanvas(256, 256, (g, s) => {
    const R = rng32(41);
    for (let x = 0; x < s; x++) { const c = .5 + .5 * Math.sin(x / s * TAU * 8); const v = 138 + 105 * (c * c * (3 - 2 * c)) | 0; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x, 0, 1, s); }
    blots(g, s, R, 14, 6, 26, '95,52,22', .30);
    for (let i = 0; i < 40; i++) { g.fillStyle = 'rgba(255,255,255,.16)'; g.fillRect(R() * s, R() * s, 6 + R() * 30, 1); }
    speckle(g, s, s, 16, R);
  }),
  tile: makeCanvas(256, 256, (g, s) => {
    const R = rng32(53); for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.fillStyle = (i + j) % 2 ? '#8b8d8c' : '#767978'; g.fillRect(i * 128, j * 128, 128, 128); }
    g.fillStyle = '#4a4c4c'; for (let i = 0; i < 2; i++) { g.fillRect(i * 128, 0, 2, s); g.fillRect(0, i * 128, s, 2); }
    blots(g, s, R, 14, 10, 40, '30,30,30', .12); speckle(g, s, s, 16, R);
  }),
  crate: makeCanvas(256, 256, (g, s) => {
    const R = rng32(61); g.fillStyle = '#a57c48'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < 5; i++) { const v = R() * 22 - 11 | 0; g.fillStyle = `rgb(${165 + v},${124 + v},${72 + v})`; g.fillRect(i * 51.2 + 1, 0, 49.5, s); g.fillStyle = 'rgba(50,30,10,.6)'; g.fillRect(i * 51.2, 0, 1.6, s); }
    for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(70,45,18,${.08 + R() * .14})`; g.fillRect(R() * s, R() * s, 1, 10 + R() * 50); }
    g.save(); g.translate(128, 128); g.rotate(Math.PI / 4); g.fillStyle = '#8a6335'; g.fillRect(-170, -15, 340, 30); g.fillStyle = 'rgba(40,24,8,.5)'; g.fillRect(-170, -16, 340, 2); g.fillRect(-170, 14, 340, 2); g.restore();
    g.fillStyle = '#7d5a30'; g.fillRect(0, 0, s, 26); g.fillRect(0, s - 26, s, 26); g.fillRect(0, 0, 26, s); g.fillRect(s - 26, 0, 26, s);
    g.strokeStyle = 'rgba(35,20,6,.7)'; g.lineWidth = 2; g.strokeRect(26, 26, s - 52, s - 52); g.strokeRect(1, 1, s - 2, s - 2);
    g.fillStyle = '#2c2520'; for (const [x, y] of [[13, 13], [243, 13], [13, 243], [243, 243], [128, 13], [128, 243], [13, 128], [243, 128]]) { g.beginPath(); g.arc(x, y, 3.2, 0, TAU); g.fill(); }
    speckle(g, s, s, 20, R);
  }),
